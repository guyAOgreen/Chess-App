spring:
  application:
    name: chess-app-core
  mvc:
    problemdetails:
      # RFC 9457 problem details, which default to OFF in Boot 4.1. Without this,
      # Spring's own errors — malformed JSON, wrong method, wrong content type —
      # return the legacy {"timestamp","error","path"} body while our rejections
      # return problem+json. Two error shapes on one API is worse than either.
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/chessapp}
    username: ${SPRING_DATASOURCE_USERNAME:chessapp}
    password: ${SPRING_DATASOURCE_PASSWORD:chessapp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Never expose datasource, disk or SSL detail to an unauthenticated
      # caller. With no security on the classpath yet this behaves as "never";
      # once authentication exists it starts serving details to authorised
      # users without a further config change.
      # Local development overrides this to "always" in application-local.yml.
      show-details: when-authorized
